# Install as /etc/nginx/sites-available/bhidewada.
# Certbot adds HTTPS after both DNS names resolve to this server.
server {
    listen 80;
    listen [::]:80;
    server_name phulewadarashtriyasmarak.com www.phulewadarashtriyasmarak.com;

    # Allow a 50 MB upload plus multipart overhead.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:5039;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
