# Replace the existing domain site only after the new backend is healthy.
# Certificate paths match the configuration supplied from this server.
server {
    listen 80;
    listen [::]:80;
    server_name phulewadarashtriyasmarak.com www.phulewadarashtriyasmarak.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name phulewadarashtriyasmarak.com www.phulewadarashtriyasmarak.com;

    ssl_certificate /etc/letsencrypt/live/phulewadarashtriyasmarak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phulewadarashtriyasmarak.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55m;
    location / {
        proxy_pass http://127.0.0.1:5039;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
